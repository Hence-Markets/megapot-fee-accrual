# Sets the Megapot engine env on the VM and recreates the container.
#
# Mirrors neo-hence's set-rebate-env workflow deliberately: same shape, same guarantees, so
# there is one way to operate a campaign on this VM rather than two. Manually dispatched and
# safe to re-run — it replaces the keys in place.
#
# The pool wallet PRIVATE KEY comes from the repo secret MEGAPOT_PRIVATE_KEY (encrypted,
# log-masked, materialised only on the self-hosted runner = the VM itself). Everything else is
# a dispatch input, so a campaign can be retuned or paused without a code push.
#
# RUNNER: needs a self-hosted runner this repo can use. The existing `hence-neo-vm` runner is
# scoped to neo-hence, so either promote it to an ORG-level runner (serves every repo, and
# hence-incognito will need the same) or register a second runner here. Until then this
# workflow will queue forever rather than fail loudly.
name: set-megapot-env

on:
  workflow_dispatch:
    inputs:
      active:
        description: "campaign on ('1') / off ('0')"
        required: true
        default: '0'
      start_ms:
        description: 'campaign start, epoch ms — REQUIRED, set before switching active on'
        required: true
      whitelist:
        description: 'comma-separated wallets. NON-EMPTY = team cohort. EMPTY = open to all (needs a users feed)'
        required: false
        default: ''
      dry_run:
        description: "'1' = rehearse, no funds move (default). '0' spends from the pool wallet"
        required: false
        default: '1'
      target:
        description: 'testnet | mainnet'
        required: false
        default: 'testnet'
      budget_usdc:
        description: 'global spend cap, USDC'
        required: false
        default: '50'

jobs:
  set-env:
    runs-on: [self-hosted, hence-neo]
    steps:
      - name: Guard — mainnet needs an explicit start and a live run
        run: |
          set -euo pipefail
          if [ "${{ inputs.target }}" = "mainnet" ] && [ "${{ inputs.dry_run }}" = "0" ]; then
            echo "::warning::MAINNET + DRY_RUN=0 — this will spend real funds from the pool wallet."
          fi
          if [ -z "${{ inputs.start_ms }}" ] || [ "${{ inputs.start_ms }}" = "0" ]; then
            echo "::error::start_ms is required. Without it every historical fill becomes eligible at switch-on."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: megapot-src

      - name: Update env + recreate the engine
        run: |
          set -euo pipefail
          DEST="$HOME/megapot/deploy"
          mkdir -p "$DEST"
          rsync -a --delete "$GITHUB_WORKSPACE/megapot-src/" "$HOME/megapot/"

          cd "$DEST"
          # keep any keys we do not manage here, replace the ones we do
          grep -vE '^(MEGAPOT_|START_MS|END_MS|DRY_RUN|TARGET|PRIVATE_KEY|TREASURY|GLOBAL_BUDGET_USDC|USERS_FILE)' .env 2>/dev/null > .env.tmp || true
          {
            cat .env.tmp 2>/dev/null || true
            echo ''
            echo '# megapot campaign (set by the set-megapot-env workflow)'
            echo "MEGAPOT_ACTIVE=${{ inputs.active }}"
            echo "START_MS=${{ inputs.start_ms }}"
            echo "MEGAPOT_WHITELIST=${{ inputs.whitelist }}"
            echo "DRY_RUN=${{ inputs.dry_run }}"
            echo "TARGET=${{ inputs.target }}"
            echo "GLOBAL_BUDGET_USDC=${{ inputs.budget_usdc }}"
            echo "PRIVATE_KEY=${{ secrets.MEGAPOT_PRIVATE_KEY }}"
            echo "TREASURY=${{ secrets.MEGAPOT_TREASURY }}"
          } > .env
          rm -f .env.tmp

          echo "megapot keys present: $(grep -cE '^(MEGAPOT_|START_MS|DRY_RUN|TARGET)' .env)"
          docker compose up -d --build --force-recreate engine
          sleep 3
          echo '--- engine log ---'
          docker compose logs --tail=25 engine
