# Megapot fee-accrual engine — runs on the SAME VM as neo-hence, as its own stack.
#
# Separate compose project (name: megapot) on purpose: it can be stopped, rebuilt or deleted
# without touching the Hence app. No ports are published; this stack has no inbound surface at
# all — the engine only makes outbound calls to Base and the Hyperliquid fills API.
#
#   cd deploy && cp .env.example .env   # fill it in
#   docker compose up -d --build
name: megapot

services:
  engine:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: engine
    image: megapot-engine:latest
    env_file: .env
    volumes:
      # The ledger MUST outlive the container. Losing it would re-credit already-paid fills
      # on the next accrue, which is the one failure mode that costs real money.
      - ledger:/app/engine/state
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -d /app/engine/state"]
      interval: 60s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  ledger:
